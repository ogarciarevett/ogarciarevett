name: Refresh latest contributions

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: read
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          ssh-key: ${{ secrets.PROFILE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Test renderer
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_contributions.py --limit 10
      - name: Commit only a changed block
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            exit 0
          fi
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          git add -- README.md
          "$RUNNER_TEMP/gitleaks" git --pre-commit --staged --redact --no-banner
          git config user.name ogarciarevett
          git config user.email ogarciarevett@gmail.com
          git commit -m "docs: refresh latest contributions"
          git push origin "HEAD:$DEFAULT_BRANCH"
