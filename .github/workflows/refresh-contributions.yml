name: Refresh latest contributions

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'ogarciarevett/ogarciarevett' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Test renderer
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_contributions.py --limit 10
      - name: Publish a reviewable refresh PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_profile.sh
